# Gradle JVM 参数：分配更多内存以适应 Compose + Room + KSP 编译
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseParallelGC

# 启用 AndroidX
android.useAndroidX=true

# Compose 1.9+ lint checks require Lint 8.8.2 or newer, independently of AGP.
android.experimental.lint.version=8.8.2

# Kotlin 代码风格
kotlin.code.style=official

# Gradle 性能优化
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# 仅启用项目用到的 R 资源（减少包体）
android.nonTransitiveRClass=true

# Compose 编译器优化（K2 模式下默认即可）
kotlin.incremental=true
