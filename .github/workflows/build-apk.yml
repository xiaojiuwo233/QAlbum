name: Build APK

# 每次推送提交 / 发起 PR 时自动测试并构建 Release APK
on:
  push:
    branches:
      - "**"
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch: # 支持在 Actions 页面手动触发

# 同一分支出现新提交时，自动取消上一次仍在进行的构建，节省 CI 额度
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# 显式指定 bash 即带 -o pipefail：管道里任一命令失败，整个步骤就失败
defaults:
  run:
    shell: bash

jobs:
  build:
    name: 构建 Release APK
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取源码
      # versionCode 取 HEAD 提交时间戳分钟数（浅克隆即可得）；fetch-depth: 0 仅让
      # 「git 时间戳不可用时回退 rev-list --count」的兜底路径拿到真实提交总数
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # 2. 配置 JDK 17（项目 compileOptions / kotlinOptions 均为 17）
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # 3. 配置 Gradle，并启用依赖与构建缓存，加速后续构建。
      #    停在 v5：v6 起缓存组件不再开源，升级即视为接受 Gradle 的使用条款
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # 4. 还原 release 签名密钥（来自 GitHub Secrets 的 base64；未配置则跳过，构建回退 debug 签名）。
      #    Secret 存在时给构建步骤追加 -PrequireReleaseSigning=true：解码失败/密码缺失直接硬失败，
      #    防止静默产出 debug 签名的「release」APK；fork 无 Secret 时不加该 flag，仍可构建
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
            echo "已写入 release.keystore（$(stat -c%s "$GITHUB_WORKSPACE/release.keystore") bytes）"
            echo "GRADLE_SIGNING_FLAG=-PrequireReleaseSigning=true" >> "$GITHUB_ENV"
          else
            echo "未配置 KEYSTORE_BASE64 Secret，本次构建回退使用 debug 签名"
          fi

      # 5. Firebase 配置
      - name: Write Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/src/release/google-services.json
            echo "已写入 Firebase 配置"
          else
            echo "未配置 GOOGLE_SERVICES_JSON Secret，本次发布版不启用统计"
          fi

      # 6. JVM 单测
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      # 7. GitHub Linux runner 上启用 KVM，执行 app 模块的 Room 迁移/分页/清理等设备测试
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace --no-parallel --max-workers=1

      # 8. 构建 Release APK（配置了密钥则用正式 release 签名，多次构建签名一致、可覆盖升级）
      - name: Build Release APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace $GRADLE_SIGNING_FLAG

      - name: Rename APK
        id: apk
        run: |
          out=app/build/outputs/apk/release
          meta="$out/output-metadata.json"
          version_name=$(jq -er '.elements[0].versionName' "$meta" | cut -d. -f1-3 | cut -d- -f1)
          version_code=$(jq -er '.elements[0].versionCode' "$meta")
          file="QAlbum-$version_name-$version_code.apk"
          cp "$out/$(jq -er '.elements[0].outputFile' "$meta")" "$RUNNER_TEMP/$file"
          ls -lh "$RUNNER_TEMP/$file"
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.apk.outputs.file }}
          path: ${{ runner.temp }}/${{ steps.apk.outputs.file }}
          archive: false
          overwrite: true
          if-no-files-found: error
          retention-days: 30
