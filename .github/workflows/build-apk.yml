name: Build APK

# 每次推送提交 / 发起 PR 时自动构建 APK，并上传为可下载的产物
on:
  push:
    branches:
      - "**"
    paths-ignore:
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "**/*.md"
  workflow_dispatch: # 支持在 Actions 页面手动触发

# 同一分支出现新提交时，自动取消上一次仍在进行的构建，节省 CI 额度
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: 构建 Release APK
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取源码
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 配置 JDK 17（项目 compileOptions / kotlinOptions 均为 17）
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3. 配置 Gradle，并启用依赖与构建缓存，加速后续构建
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 4. 确保 gradlew 具备可执行权限
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 5. 还原 release 签名密钥（来自 GitHub Secrets 的 base64；未配置则跳过，构建回退 debug 签名）
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
            echo "已写入 release.keystore（$(stat -c%s "$GITHUB_WORKSPACE/release.keystore") bytes）"
          else
            echo "未配置 KEYSTORE_BASE64 Secret，本次构建回退使用 debug 签名"
          fi

      # 6. 构建 Release APK（配置了密钥则用正式 release 签名，多次构建签名一致、可覆盖升级）
      - name: Build Release APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      # 7. 输出产物路径与体积，便于在构建日志中确认
      - name: List APK output
        run: ls -lh app/build/outputs/apk/release/

      # 8. 上传 APK 为可下载产物（在本次 workflow run 的 Artifacts 区下载）
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: QAlbum-release-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
